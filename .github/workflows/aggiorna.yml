name: Aggiorna catalogo Pokémon

on:
  schedule:
    - cron: "17 7 * * *"     # ogni giorno alle 7:17 UTC (8:17 in Italia d'inverno, 9:17 d'estate)
  workflow_dispatch:          # permette di lanciarlo a mano dalla scheda Actions

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Carica espansioni, carte e prezzi del giorno
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python carica_catalogo.py
